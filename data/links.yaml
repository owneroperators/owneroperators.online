# Outbound links (streaming + social). Order here = render order everywhere.
# Rendered in three surfaces, all reading this one list:
#   - home release block  → partials/links.html (ASCII-ornament tiles)
#   - footer icons        → entries flagged `footer: true` (brand SVG glyphs)
#   - /links/ hub page     → layouts/_default/linkhub.html (terminal list)
# Brand glyphs are mapped name → inline SVG in partials/brand-icon.html.
# Optional per-entry flags:
#   footer: true    also surface this link as an icon in the site footer
#   download: "…"   save the file instead of streaming it (the direct MP3)
#   ornament: |     small ASCII glyph shown above the name in the release tiles
#   soon: true      render non-clickable with a "coming soon" label (not live yet)
#   break: true     release tiles only — force a row break BEFORE this entry
- name: download the mp3
  url: /mp3/echoes2.mp3
  download: "OWNER-OPERATORS — Echoes and Static.mp3"
  ornament: |2
