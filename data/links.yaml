# Outbound links surfaced in the release block on the home page.
# Rendered by themes/oo/layouts/partials/links.html.
# Spotify and Apple Music aren't live yet — marked `soon: true` so they render
# non-clickable with a "coming soon" hover label. Drop the flag and add a real
# `url:` when the artist profiles go live.
# Each link has an optional `ornament` — a small ASCII glyph rendered above the name.
# The direct MP3 download rides in the same row — `download:` makes the
# anchor save the file instead of streaming it (see links.html).
