{{ define "main" }}
  <article class="page-lineup">
    <header class="page-head">
      <p class="eyebrow"><a href="{{ "/" | relURL }}">OWNER/OPERATORS</a></p>
      <h1 class="page-title">{{ .Title }}</h1>
    </header>
    {{ with .Content }}<div class="prose lineup-intro">{{ . }}</div>{{ end }}
    {{ range .Pages.ByWeight }}
      <section class="operator-full prose" id="{{ with .File }}{{ .BaseFileName }}{{ end }}">
        {{ .Content }}
      </section>
    {{ end }}
  </article>
{{ end }}
